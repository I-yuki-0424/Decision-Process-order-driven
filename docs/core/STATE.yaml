      several eval_cycles budgets, no synthetic data. Mechanism: ChunkPPO.evaluate() always did a FRESH
      reset_envs() and then episode_summary() averaged return only over envs that reached `done` inside that one
      fixed-length window; ChunkPPO.run()'s training rollout instead keeps `ws` persistent across all updates, so
      it sees a steady mixed stream of completions. At the checkpoint's original eval_cycles=64, only ~8% of the
      1024 envs (83/1024) finished an episode in time to be counted at all -- not "several hundred" as the TASK-013
      docstring wrongly assumed -- so mean_return was computed over just the fastest (likely worst) 8% of episodes,
      systematically excluding the majority that needed longer to finish. Doubling the window to 128 ticks alone
      (same checkpoint, same policy, zero retraining) raised mean_return 0.257->0.461 and done-fraction 8%->37%,
      which is decisive: a real behaviour metric cannot jump like that from re-measuring an unchanged policy unless
      the original measurement was biased.
      FIX: added `eval_windows` to ChunkPPOConfig (default 1, preserves old behaviour for any caller that doesn't
      opt in) and rewrote evaluate() to run `eval_windows` sequential eval_cycles-sized windows with env state
      carried FORWARD between them (same persistence pattern as training) instead of one big window, pooling
      done-episode statistics across all windows. This gives episodes eval_windows x eval_cycles ticks to finish
      while keeping peak memory at a single eval_cycles-sized rollout (the direct cause of TASK-013's OOM is
      avoided by construction, not by luck). craftax_calibration_config now sets eval_windows=4.
      RE-VERIFIED against both saved TASK-013 checkpoints (seeds 0 and 1, step_15.pkl) with the fix:
