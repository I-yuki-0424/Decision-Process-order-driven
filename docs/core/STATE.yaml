  - id: "TASK-20260927-008-passive-wm-v2"
    created_at: "2026-09-27T00:00:00Z"
    status: "done"
    description: >
      Operator request (2026-09-27): a "do-nothing" (noop) world model should make action selection easier; train it
      decoupled from the policy beforehand (operator: "reinforcement learning it independently") and verify existing
      architectures + derivatives in that direction. Local 3060 Ti (OOM-prone, one container at a time) + Kaggle in
      parallel with separate notebooks.
      CRITICAL REVIEW (recorded per CLAUDE.md): (1) TASK-004 WM predicted only 4 vitals under noop; their noop future is
      near-deterministic decay of the current vitals, i.e. a function of inputs the policy already sees, so no gain was
      possible -- that failure says nothing about passive WMs in general. (2) A world model is fit by prediction (supervised /
      self-supervised); "RL" only makes sense as the data-collection policy (curiosity / disagreement) or state-distribution
      choice, not as the learning rule. (3) Chess analogy is wrong: noop-future != opponent's next move; it omits the agent's
      own effect, which is what a plan needs; passive prediction alone cannot produce a checkmate sequence. (4) Off-policy
      data contains noop only where the behaviour policy chose noop; passive branches in this repo use simulator branching
      (offline data only; not available for real robot data -- there it must be an action-conditional model queried at noop).
      Decisive first test: ORACLE CEILING (policy fed the TRUE simulated noop future, upper bound by construction). If it does
      not beat base, no passive-WM accuracy improvement can help this policy learner.
    spec_ref: "docs/experiments/2026-09-27_passive_wm_v2/README.md"
    validation_commands:
      - "python scripts/pre_commit_ban_check.py"
      - "python -m unittest tests.test_architecture_fixes"
    result: >
      RUN COMPLETE. Craftax noop future: predictable part is clock-like (vitals skill 0.55 @h8, light 0.78); mob counts/motion barely predictable (mob-cell recall 1-9%).
      Policy (4 seeds, 4,800 eps): base = oracle-noop-future = trained WM = untrained-WM control ~3.0; POSITIVE CONTROL (true reward of every action) also ~2.9 => the Craftax
      test has no power; no evidence for or against. Pendulum-MPC: passive pre-training helps only when passive data covers states the active data never visits (pooled MLP
      -203 vs -600); the decoupled schedule adds nothing over pooling; port-Hamiltonian structure + passive-pretrained V,R + G learned from 8 trajectories reaches the ceiling (-195 vs -196).
      RL for the WM not implemented (a WM is fit by prediction; coverage is the lever). Details docs/experiments/2026-09-27_passive_wm_v2/README.md.
      Impact check: new files only (adapter subclass, candidates/passive_wm_full.py, scripts); no existing symbol modified; scip-neo4j not queried.
    blockers:
      - "Craftax Stage B lacks power (positive control flat); needs a stronger learner before WM arms are informative."
      - "oracle_act only 2 seeds; distribution shift random->policy states not measured; curiosity collector not built."

  - id: "TASK-20260927-009-noop-anticipation-heuristic"
    created_at: "2026-09-27T20:00:00Z"
    status: "done"
    description: >
      Operator proposal (2026-09-27, follow-up): a rigorous world model = a learned prediction of t+1 from "existence alone"
      (no action), with a literal formula T+2 = (T+0)*(T+1) over "hidden dimensions"; train it via whole-episode (not per-step)
      batch updates on episodes ending in death; use it to train an action model that "lives longer"; retrain the WM on the
      resulting longer episodes; at test time treat the model's own t+1 prediction as the next t (autoregressive/off-policy).
      CRITICAL REVIEW (recorded per CLAUDE.md, stated to the operator before implementing): (1) the T+2=(T+0)*(T+1) formula has no
      defined semantics as literal arithmetic on the raw state vector -- unfalsifiable as written; read here as "learn a latent
      representation" (what an MLP hidden layer / Dreamer-style latent already is), not literal elementwise multiplication.
      (2) DECISIVE FLAW IN THE MECHANISM: a noop-only prediction is the SAME value added to every action's predicted outcome, so
      argmax over actions is invariant to it -- it cannot by itself rank actions. It can only matter combined with something
      action-dependent: the real simulator (oracle, disallowed at test time) or a hand-specified action-effect model
      (CRAFTAX_RESOURCE_EFFECTS, already in src/environment/craftax_env_adapter.py -- static, approximate, not learned/oracle).
      Tested here as: does adding the WM's noop-anticipation to that known-effects table change which vital becomes the
      bottleneck, and does that change survival? (3) Testing this via the existing RL policy learner would reproduce
      TASK-20260927-008's null result for the wrong reason (that learner had no power at all, not even from a positive control).
      Tested instead with a deterministic heuristic decision rule (no RL training loop), so the WM-quality question is decidable
      on its own. (4) Whole-episode-batch vs pooled-shuffle training and h=1 vs h=8 autoregressive anticipation are legitimate,
      cheap ablations, tested directly.
    spec_ref: "docs/experiments/2026-09-27_noop_anticipation_heuristic/README.md"
    validation_commands:
      - "python scripts/pre_commit_ban_check.py"
      - "python -m unittest tests.test_architecture_fixes"
    result: >
      RUN COMPLETE (deterministic heuristic, no RL learner, n=384 episodes/arm, T=250). effects_wm_h1 (known action-effects
      table + WM noop-anticipation) does NOT beat effects_only (149.6 vs 149.8 mean survival steps, s.e.m. ~3.5): the WM
      anticipation adds nothing measurable once the known table is used. effects_wm_h8 is worse than h1 (146.3 vs 149.6),
      confirming the pre-registered compounding-error concern. None of the action-based heuristics beat noop_always (152.9,
      the best arm): every non-noop action costs energy in the known table with no reliable food/water source for an
      untooled random walk, so a vitals-only rule cannot substitute for exploration. Training-procedure ablation: episodic
      (one gradient step per whole episode, as literally proposed) is uniformly worse than pooled shuffled-minibatch MSE at
      every horizon (e.g. 0.284 vs 0.244 at h=8) -- the proposed schedule is not an improvement. Bootstrap on the
      best-surviving (noop-only) episodes overfit hard: held-out MSE improved on its own narrow distribution but got 10x
      worse on the original random-policy distribution (4.48 vs 0.244 at h=8), and produced no survival gain when fed back
      into the heuristic. Decisive structural point stated to the operator before running: a noop-only prediction is added
