      Re-run verifications invalidated by the old Craftax adapter / unresolved bugs: variant_5_1..5_4 and mdp_branch on CraftaxObsAdapter, isolate NaN entropy,
      ablate idea6_full (integrator/gate/residual), minimal per-arm lr tuning, Dreamer-lite fidelity. Local Docker GPU + Kaggle in parallel.
    spec_ref: "docs/experiments/2026-09-26_rerun_verification/README.md"
    validation_commands:
      - "python scripts/pre_commit_ban_check.py"
      - "python -m unittest tests.test_architecture_fixes"
