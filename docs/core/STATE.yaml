  - id: "TASK-20260925-001-dpod-candidates"
    created_at: "2026-09-25T00:00:00Z"
    status: "done"
    description: >
      Port each docs/DPOD.ipynb architecture candidate (Variant5_1Bace,
      Variant5_2, Variant5_3, Variant5_4, MDPBranch, TransformerBranch,
      WorldModel/Idea 6) into src/model/candidates/ following the existing
      init_*/forward_* PyTree convention, build one shared pluggable Craftax
      training/eval driver (src/pipeline/candidate_benchmark.py), add real-data
      W-distribution and per-achievement plots, and generalize
      src/model/checkpoint.py to async, periodic, resumable checkpointing for
      any PyTree.
    spec_ref: "docs/DPOD.ipynb"
    validation_commands:
      - "python scripts/pre_commit_ban_check.py"
      - "python -m unittest tests.test_architecture_fixes"
      - "python -c \"from src.pipeline.candidate_benchmark import run_candidate_benchmark_suite; run_candidate_benchmark_suite(candidate_names=['transformer_branch','variant_5_1'], train_episodes=2, eval_episodes=2, max_steps_per_ep=5, d_model=32, output_json_path='output/benchmark_candidates_smoketest.json', checkpoint_root='output/checkpoints_smoketest')\""
    result: >
      PASS. All 6 wired candidates (variant_5_1..5_4, mdp_branch,
      transformer_branch) run real forward passes over InputContextN and were
      smoke-tested end to end against the real CraftaxEnvAdapter (2 train + 2
      eval episodes, 5 steps/ep, d_model=32): training, REINFORCE-style
      gradient updates, periodic async checkpointing (step_3/6/9/10.pkl
      written, verified resumable via AsyncCheckpointManager.resume()), real
      Crafter-score/achievement-rate evaluation, and both new plots
      (plot_predicted_transition_distribution,
      plot_candidate_achievement_breakdown) all completed without error.
      scripts/pre_commit_ban_check.py and
      tests.test_architecture_fixes (5 tests) both pass. No GPU used; a
      full-scale (1000-episode) run is deferred pending separate operator
      authorization per ADR-002. WorldModel (src/model/candidates/world_model.py)
      is implemented but deliberately NOT wired into the training pipeline --
      see blockers.
      Dependency-impact check: scip-neo4j MCP server was reachable.
      check_symbol_constraints on src.model.checkpoint.save_model_checkpoint
      returned ALLOWED (not LOCKED_CORE_THEORY). analyze_change_impact on
      both save_model_checkpoint and load_model_checkpoint returned zero
      dependents, confirmed by grep (only src/model/checkpoint.py itself
      references them) -- so both were left with unchanged signatures and the
      new generic functionality was added alongside them
      (save_pytree_checkpoint / load_pytree_checkpoint / AsyncCheckpointManager)
      rather than modifying them. plotter.py and craftax_benchmark.py were
      extended (new functions / new module) without touching any existing
      function body, so no impact check was needed for those.
    blockers:
      - >
        Critical-review objection 1 (mean-pool discretization defect):
        docs/DPOD.ipynb's TensorOps.embeddings_to_scalar_id mean-pools a
        (N,d) embedding block to one scalar per row; the notebook's own
        docstring says this makes MDPSolver's top_actions come out identical
        across every row/batch element -- nothing is distinguished/learned
        through that path. Every candidate that uses it (Variant5_1Bace's
        mdp_array, Variant5_4, MDPBranch) inherits this. Fix applied: replaced
        with shared_stages.discretize_embeddings_to_ids, a small learned
        linear classifier head trained jointly via the action loss. This is
        an explicit placeholder for an open design question, NOT a validated
        final discretization scheme -- it only guarantees real per-candidate
        distinctions reach the MDP solver instead of a collapsed constant.
        Gradients do not flow through the argmax in this head from the
        action-selection loss (a known, documented limitation of the
        placeholder), only from anywhere else it's used.
      - >
        Critical-review objection 2 (Variant5_1Bace shape bug): the notebook
        column_stacks d-dimensional embedding blocks into what
        MDPSolver._solve_single expects to be 6 single scalar columns (S, S_1,
        A, P, R, G via array_to_action[:,0] etc). Fixed in the port: uses the
        discretization-fix ids (objection 1) plus the same
        build_mdp_transition_array used by MDPBranch/Variant5_4, not the raw
        column_stack.
      - >
        Critical-review objection 3 (WorldModel / Idea 6 oracle-leakage +
        missing-encoder risk): deferred, NOT wired into the Craftax
        training/action-selection pipeline. Implemented standalone in
        src/model/candidates/world_model.py because it is structurally sound
        Hamiltonian-NN code on its own terms. Reasons for non-wiring: (a) it
        needs canonical (q,p) coordinates that no existing A/S/H/T encoder
        produces; (b) if its FormulaPresets were copied from the Craftax
        simulator instead of being independent textbook physics, the model
        would just reproduce the environment (oracle leakage) -- the presets
        shipped are generic Newtonian mechanics (gravity/drag/buoyancy/ground
        contact), not fit to Craftax, but that independence must be
        maintained by whoever wires this in; (c) no specified connection to
        action selection (MDPSolver / the candidate branches) exists in the
        source material; (d) event jumps / state-dimension changes are not
        implemented.
      - >
        Critical-review objection 4 (dead code, not ported): AuxiliaryActionOps
        (cell 16, two standalone functions never called by anything else in
        the notebook, including its own test cell) and the generate_action
        dispatcher stub (cell 26, whose inner closures call e.g.
        MDPSolver.solve() with zero arguments against a signature requiring at
        least two, and is never invoked anywhere) were both left unported per
        the operator's explicit no-bloat instruction. Neither is dead in the
        sense of "unused but load-bearing" -- both were already non-functional
        stubs in the source notebook.
      - >
        Full-scale (1000-episode, GPU) Craftax training for the candidates is
        deferred pending separate operator authorization -- ADR-002 covers
        Phase II runs of the existing hierarchical/flat models, not these new
        candidates, and this task only validated short CPU-feasible smoke
        runs (see validation_commands / result above).

  - id: "TASK-20260925-002-candidates-smoke-verify"
    created_at: "2026-09-25T09:00:00Z"
    status: "done"
    description: >
      Small-scale, real Kaggle-GPU end-to-end verification of the DPOD
      candidate pipeline added in TASK-20260925-001 (training, real Craftax
      eval, AsyncCheckpointManager, and the new
      plot_predicted_transition_distribution /
      plot_candidate_achievement_breakdown plots). NOT an ADR-002 Phase II
      run: order-of-hundreds training steps per candidate, ~15-17 minutes of
      GPU wall-clock, on a new, separate kernel
      (bfloat16/dpod-candidates-smoke-verify) so the existing production
      kernels were never touched.
    spec_ref: "kaggle_kernel_candidates_smoke/kernel-metadata.json"
    validation_commands:
      - "python scripts/pre_commit_ban_check.py"
      - "python -m unittest tests.test_architecture_fixes"
      - "python scripts/kaggle_run_candidates_smoke.py --candidates transformer_branch variant_5_1 mdp_branch --train-episodes 15 --eval-episodes 5 --max-steps-per-ep 15 --d-model 32 --checkpoint-every 20 --seed 2026 --run-id candidates_smoke_v2"
    result: >
      PASS on the 2nd push (kernel version 2), after fixing a real bug found
      by the 1st push (kernel version 1, see blockers). All 3 candidates
      (transformer_branch, variant_5_1, mdp_branch) trained for real
      (15 episodes x 15 steps/ep = 225 REINFORCE-style gradient-update steps
      each) and evaluated for real (5 episodes x 15 steps/ep) against the
      real CraftaxEnvAdapter on an actual Kaggle GPU
      (jax.default_backend()=='gpu', 2x CudaDevice, JAX 0.7.2), confirmed via
      the notebook's own printed "JAX Backend: gpu" / "JAX Devices" lines in
      the fetched log. Observed real per-candidate metrics: crafter_score=0.0,
      avg_unlocked_count=0.0, avg_steps=15.0 for all three (no Craftax
      achievement unlocks in a 15-step episode is expected/sane -- Craftax
      achievements typically need tens of steps of real navigation/gathering,
      and this run's purpose was pipeline verification, not a scored
      benchmark); execution_ms_per_step: transformer_branch=24.3,
      variant_5_1=475.9, mdp_branch=298.3 (all real wall-clock GPU timings).
      AsyncCheckpointManager wrote and the run fetched real
      step_20.pkl..step_225.pkl checkpoints for all 3 candidates. All three
      new plots (candidate_per_achievement_breakdown.png,
      candidate_predicted_transition_distribution.png,
      craftax_crafter_score_summary_seq005.png) were generated with real,
      non-placeholder content (248KB/238KB/195KB PNGs, verified openable with
      correct pixel dimensions) and are committed under
      output/kaggle_candidates_smoke/candidates_smoke_v2/. Full run log at
      output/kaggle_candidates_smoke/candidates_smoke_v2/kaggle_run.log.
      Total GPU wall-clock: ~17.2 min for the successful run (well under the
      45-min guardrail). scripts/pre_commit_ban_check.py and
      tests.test_architecture_fixes (5 tests) both pass locally after the fix.
      Dependency-impact check: scip-neo4j MCP server was reachable.
      check_symbol_constraints on shared_stages.build_mdp_transition_array
      and plotter.plot_predicted_transition_distribution both returned
      ALLOWED (not LOCKED_CORE_THEORY). analyze_change_impact returned an
      empty dependent list for build_mdp_transition_array (treated as
      incomplete per protocol, not as "safe"); confirmed by grep that its
      only callers are mdp_branch.py, variant_5_1_shared_attention.py, and
      variant_5_4_single_shot.py, all read and considered -- the fix is a
      numerical clip, not a behavior change for any input that wasn't already
      overflowing, so none needed further changes.
    blockers:
      - >
        Kernel version 1 (run candidates_smoke_v1) FAILED with a real error:
        papermill/ValueError "autodetected range of [nan, nan] is not
        finite" from plot_predicted_transition_distribution's np.histogram
        call. Root-caused (reproduced locally, not just on Kaggle) to
        src/model/candidates/shared_stages.py's
        build_mdp_transition_array: state/next_state are small integer
        discretization ids (0..num_actions-1); whenever the discretized
        next_id was 0, the function's 1e-8 epsilon floor let
        `gradient = state/safe_next_state*100` reach ~1e11, overflowing
        float32 to +/-inf inside solve_bellman_topk's Bellman value
        iteration, producing `inf - inf = NaN` Q-values that propagated into
        mdp_branch's predicted_next_state (100% NaN, reproduced with
        train_episodes=15 on CPU too -- not GPU-specific, not a
        training-length artifact). This is a genuine numerical-stability bug
        in existing (not newly written) candidate code, independent of this
        verification task's own new files. Fixed by raising eps to 1e-3 and
        clipping `gradient` to [-1e4, 1e4] (src/model/candidates/shared_stages.py,
        build_mdp_transition_array) -- re-verified NaN-free locally and on
        the Kaggle GPU re-run (kernel version 2, PASS). Also hardened
        plot_predicted_transition_distribution (src/pipeline/plotter.py) to
        skip non-finite values per-candidate with a visible in-plot notice
        instead of crashing the whole multi-candidate figure, as defense in
        depth -- this does not hide the underlying metric, which is still
        recorded as-is in the results JSON.
      - >
        variant_5_1 also calls build_mdp_transition_array but did not
        produce NaN in either kernel run -- the instability is real but
        random-seed/discretization-dependent (triggers only when the
        discretize head's argmax lands on id 0 for next_state), not
        guaranteed to reproduce on every run. The fix removes the overflow
        path structurally (bounded gradient) rather than relying on avoiding
        the trigger condition.
      - >
        All-zero achievement unlock rates / 0.0 crafter_score across all
        three candidates in this run are expected given the run's small
        scale (15 steps/episode, mostly-untrained ~225-step REINFORCE
        policies) and should not be read as a negative signal about model
        quality -- this task verified the pipeline runs correctly end to
        end on real GPU hardware with real numbers, not that these
        candidates already solve Craftax achievements.

  - id: "TASK-20260925-003-candidate-convergence"
    created_at: "2026-09-25T11:00:00Z"
    status: "done"
    description: >
      Train/test the merged DPOD candidates in parallel on local WSL2 Docker (RTX 3060 Ti)
      and Kaggle GPU at small scale (2,000 episodes each, <50,000 cap); consolidate results.
    spec_ref: "docs/experiments/2026-09-25_candidate_convergence/README.md"
    validation_commands:
      - "python scripts/pre_commit_ban_check.py"
      - "python -m unittest tests.test_architecture_fixes"
    result: >
      RUN COMPLETE, EFFECTIVENESS NOT DEMONSTRATED. 8 runs + 3 normlogits A/B runs; no trained candidate beats
      the uniform-random policy (return 1.46). MDP-search candidates output degenerate logits (NaN entropy).
      Details in docs/experiments/2026-09-25_candidate_convergence/03_findings.md; data in
      output/experiments/2026-09-25_convergence/. Dependency-impact check (scip-neo4j) not run: no existing symbol modified
      (new files only).
    blockers:
      - "variant_5_1 / variant_5_4 NaN entropy persists after logit normalisation; source undiagnosed."
      - "Single seed; no variance estimate."

  - id: "TASK-20260925-004-idea6-worldmodel"
    created_at: "2026-09-25T13:00:00Z"
    status: "done"
    description: >
      Verify Idea 6 (WorldModel/HNN) per operator spec: passive (noop) world model first, then the action Transformer with
      the frozen WM; local Docker GPU + Kaggle in parallel; <50,000 episodes; mid-scale model.
    spec_ref: "docs/experiments/2026-09-25_idea6_worldmodel/README.md"
    validation_commands:
      - "python scripts/pre_commit_ban_check.py"
      - "python -m unittest tests.test_architecture_fixes"
    result: >
      RUN COMPLETE. Stage A: HN and MLP world models beat persistence by ~58%/55% at 8 steps (held-out episodes).
      Stage B (transformer_branch d_model=512, 875K params, 4,800 eps/run, 2 seeds x 4 arms): no benefit from WM features
      (returns 2.9-3.2; untrained-WM control equals trained). The large gain over random is due to the new
      CraftaxObsAdapter (old adapter hid the observation). No LLM baseline exists, so the cost-parity claim is untested.
      Impact check: only new files plus an optional `adapter` parameter on run_experiment; scip-neo4j not queried.
    blockers:
      - "TASK-003 candidate conclusions were measured on the observation-blind adapter and should be re-run on CraftaxObsAdapter."
      - "Only 2 seeds per arm; a small WM benefit cannot be excluded, but no signal was seen."

hazards:
  - "<condition to watch for>: <what breaks if it's ignored>"  # Example
  - >
    src/model/candidates/*.py's MDP-search candidates (variant_5_1,
    variant_5_4, mdp_branch) route action selection through
    discretize_embeddings_to_ids's jnp.argmax, which blocks gradient flow
    from the action-selection loss into that head. Training these three
    candidates end to end will visibly improve estimated_costs /
    predicted_next_state / progress / validity (whose heads DO get gradient)
    but the discretization head itself will not learn from the policy loss
    alone -- do not report improved action_logits accuracy for these three
    without checking whether it's coming from somewhere else (e.g. the
    encoder shifting via the other heads' gradients) rather than a learned
    discretization.
