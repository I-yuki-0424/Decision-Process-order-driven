# Model ID registry (MASTER_GUIDANCE <experiment_tracking>).
# ID format: <IdeaName>_<OriginalID>_<DerivativeID>_<SubDerivativeID>, e.g. Idea4_O01_D01_S00
#   IdeaName    : idea the model originates from (Base = plain RL baseline, Idea4, Idea6, Chunk, ...). No underscores inside it.
#   OriginalID  : O<NN>, the original model of that idea.  DerivativeID: D<NN>, D00 = the original itself.
#   SubDerivativeID: S<NN>, S00 = no sub-derivative.
# proper_name: assigned ONLY by the operator (set proper_name_by: operator together with it). Agents leave it null.
# status: archived = dead end (reason in archived_reason): its runs keep this model_id but it is not shown on the Models tab.
# status: provisional = drafted by an agent from the Phase-1 arm names; operator confirms or renames. After editing this file rebuild
#   the store (`rm -rf mlflow_local` then `python scripts/mlflow_ingest.py`); it is always rebuildable from the files under output/.
# match keys: `arm` = the descriptive arm string in result files (NOT arm_key: one arm_key can hide different configs).
models:
  Base_O01_D00_S00:
    arms: ["mlp512x3"]
    description: "PPO, 3x512 MLP actor-critic, symbolic observation (pure-RL baseline)"
    status: provisional
    proper_name: null
  Base_O02_D00_S00:
    arms: ["gru256"]
    description: "PPO, GRU-256 recurrent actor-critic (pure-RL baseline)"
    status: provisional
    proper_name: null
