# Model ID registry (MASTER_GUIDANCE <experiment_tracking>).
# ID format: <IdeaName>_<OriginalID>_<DerivativeID>_<SubDerivativeID>, e.g. Idea4_O01_D01_S00
#   IdeaName    : idea the model originates from (Base = plain RL baseline, Idea4, Idea6, Chunk, ...). No underscores inside it.
#   OriginalID  : O<NN>, the original model of that idea.  DerivativeID: D<NN>, D00 = the original itself.
#   SubDerivativeID: S<NN>, S00 = no sub-derivative.
# proper_name: assigned ONLY by the operator (set proper_name_by: operator together with it). Agents leave it null.
# status: archived = dead end (reason in archived_reason): its runs keep this model_id but it is not shown on the Models tab.
# status: provisional = drafted by an agent from the Phase-1 arm names; operator confirms or renames. After editing this file rebuild
#   the store (`rm -rf mlflow_local` then `python scripts/mlflow_ingest.py`); it is always rebuildable from the files under output/.
# match keys: `arm` = the descriptive arm string in result files (NOT arm_key: one arm_key can hide different configs).
models:
  Base_O01_D00_S00:
    arms: ["mlp512x3"]
    description: "PPO, 3x512 MLP actor-critic, symbolic observation (pure-RL baseline)"
    status: provisional
    proper_name: null
  Base_O02_D00_S00:
    arms: ["gru256"]
    description: "PPO, GRU-256 recurrent actor-critic (pure-RL baseline)"
    status: provisional
    proper_name: null
  Base_O02_D01_S00:
    arms: ["cnngru32-64w256"]
    description: "gru256 with CNN tile encoder (control for tf_gru)"
    status: provisional
    proper_name: null
  Idea4_O01_D00_S00:
    arms: ["tf64x2h4"]
    description: "PPO, tile-token Transformer actor (64d x 2 layers, 4 heads, history 4), no memory"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "pure Transformer actor (no memory) < ppo_gru at 1M (29.2 vs 33.6 reward_pct); kept as the parent of the Truck line"
    proper_name: null
  Idea4_O01_D01_S00:
    arms: ["tfgru64x2w256"]
    description: "Transformer tile encoder + GRU-256 memory, PPO (Phase-1 best at 1M steps)"
    status: provisional
    proper_name: "Truck"
    proper_name_by: operator   # named by the operator 2026-10-01
  Idea4_O01_D01_S01:
    arms: ["tfgru64x2w256+wm_trained"]
    description: "tf_gru + trained Idea-6 world-model features"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "trained WM features == frozen random WM (null result); parked"
    proper_name: null
  Idea4_O01_D01_S02:
    arms: ["tfgru64x2w256+wm_random"]
    description: "tf_gru + frozen random-init world model (control)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "control for Idea4_O01_D01_S01"
    proper_name: null
  Idea6_O01_D00_S00:
    arms: ["tf64x2h4+wm_trained"]
    description: "Transformer actor + trained Idea-6 world-model features"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "trained WM features == frozen random WM at 100k and 1M; parked"
    proper_name: null
  Idea6_O01_D00_S01:
    arms: ["tf64x2h4+wm_random"]
    description: "Transformer actor + frozen random-init world model (control)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "control for Idea6_O01_D00_S00"
    proper_name: null
  Chunk_O01_D00_S00:
    arms: ["chunkppo_k1_h4"]
    description: "ChunkPPO, commit length k=1, history 4 (latency/goal-chunking line; reduces to PPO + small Transformer at k=1)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "ChunkPPO k=1 < ppo_gru at 1M (23.9 vs 33.6); reduces to PPO + small Transformer at k=1"
    proper_name: null
  # --- exploratory 100k tuning arms (tune_100k / tune_100k_explore); added provisionally when Phase-1 results were first ingested ---
  Idea4_O01_D02_S00:
    arms: ["tf64x2h0"]
    description: "tf64x2h4 with history length 0 (ablation: no action history)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "exploratory 100k ablation, no gain"
    proper_name: null
  Idea4_O01_D03_S00:
    arms: ["tf128x3h4"]
    description: "tf64x2h4 scaled to d=128, 3 layers (size ablation)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "exploratory 100k size ablation, no gain"
    proper_name: null
  Idea4_O01_D04_S00:
    arms: ["tf64x2h4+aux0.1"]
    description: "tf64x2h4 + auxiliary loss, aux_coef=0.1 (arm tf_aux)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "exploratory 100k aux-loss ablation, no gain"
    proper_name: null
  Idea4_O01_D04_S01:
    arms: ["tf64x2h4+aux1"]
    description: "tf64x2h4 + auxiliary loss, aux_coef=1.0 (arm tf_aux)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "exploratory 100k aux-loss ablation, no gain"
    proper_name: null
  Idea4_O01_D05_S00:
    arms: ["tf64x2h4+sc"]
    description: "tf64x2h4 with a separate MLP critic (arm-kwargs critic=mlp)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "exploratory 100k critic ablation, no gain"
    proper_name: null
  Idea6_O01_D01_S00:
    arms: ["tf64x2h4+wm_trained+sc+q"]
    description: "Idea6 wm_trained with separate critic and the 'q' variant (arm tf_wmq; see scripts/run_phase1_sweep.py)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "exploratory 100k WM variant, no gain"
    proper_name: null
  Idea6_O01_D01_S01:
    arms: ["tf64x2h4+wm_random+sc+q"]
    description: "frozen random-init control for Idea6_O01_D01_S00 (arm tf_wmq_random)"
    status: archived   # hidden from the MLflow Models tab; runs stay registered under this id
    archived_reason: "control for Idea6_O01_D01_S00"
    proper_name: null
